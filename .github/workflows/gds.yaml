# Official GF analog custom-GDS flow with explicit GF26e PDK precheck.
# See docs/TARGET.md; there is no ttgf26e action tag as of 2026-11-25.
name: gds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Validate target and read top module
        id: top
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, re
          from pathlib import Path
          t = json.loads(Path('tools/target.json').read_text())
          assert t['shuttle_id'] == 'ttgf26e'
          assert t['pdk'] == 'gf180mcuD'
          assert t['pdk_revision'] == '1689ac3f2dc763876eaf967227c7dfe831b031ae'
          top = json.loads(Path('info.yaml').read_text())['project']['top_module']
          assert re.fullmatch(r'tt_um_[a-zA-Z0-9_]+', top), top
          manifest = json.loads(Path('PROVENANCE.json').read_text())
          for key in ('root_artifact_sha256', 'source_sha256'):
              entries = manifest[key]
              assert isinstance(entries, dict) and entries, key
              for name, expected in entries.items():
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts, name
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          for name in (f'gds/{top}.gds', f'lef/{top}.lef', f'gds/{top}.v'):
              assert Path(name).stat().st_size > 0, name
              assert name in manifest['root_artifact_sha256'], name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('TOP_MODULE=' + top + '\n')
          PYTHON
      - name: Build GDS, OAS and PNG artifacts
        uses: TinyTapeout/tt-gds-action/custom_gds@df73a1e7b52e940423ff55f9354b2b8140d38cb7
        with:
          pdk: gf180mcuD
          tools-ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8
          top_module: ${{ steps.top.outputs.TOP_MODULE }}
          gds_path: gds/${{ steps.top.outputs.TOP_MODULE }}.gds
          lef_path: lef/${{ steps.top.outputs.TOP_MODULE }}.lef
          verilog_path: gds/${{ steps.top.outputs.TOP_MODULE }}.v
      - name: Require PNG preview
        run: test -s gds_render.png

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PDK: gf180mcuD
      PDK_ROOT: /home/runner/pdk
      PDK_VERSION: 1689ac3f2dc763876eaf967227c7dfe831b031ae
    steps:
      - name: Checkout unmodified official GF26e support tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8
          path: tt
      - name: Download candidate from this exact workflow run
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tt/precheck/requirements.txt
      - name: Install official precheck dependencies and pinned Ciel
        run: |
          pip install -r tt/precheck/requirements.txt
          pip install ciel==2.5.0
      - name: Cache GF26e PDK components
        uses: actions/cache@v5
        with:
          path: /home/runner/pdk
          key: gf26e-pdk-1689ac3f2dc763876eaf967227c7dfe831b031ae-pr-7t-io
      - name: Install exact GF26e PDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ciel enable --pdk gf180mcu "$PDK_VERSION" -l gf180mcu_fd_pr -l gf180mcu_fd_sc_mcu7t5v0 -l gf180mcu_fd_io
      - name: Verify installed PDK and artifact technology
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          source = (Path(os.environ['PDK_ROOT']) / 'gf180mcuD/SOURCES').read_text().split()
          assert source == ['open_pdks', os.environ['PDK_VERSION']], source
          assert json.loads(Path('tt_submission/pdk.json').read_text())['PDK'] == 'gf180mcuD'
          PYTHON
      - name: Install pinned precheck Nix environment
        uses: rikhuijzer/cache-install@c46c673b14b0780c6749d7a45f26ebc07c8c7388
        with:
          key: nix-gf26e-${{ hashFiles('tt/precheck/default.nix') }}
          nix_file: tt/precheck/default.nix
      - name: Build Nix packages
        working-directory: tt/precheck
        run: nix-build
      - name: Run all unmodified official checks on GF26e PDK
        working-directory: tt/precheck
        shell: bash
        run: |
          mkdir -p reports
          nix-shell --run "python precheck.py --gds ${{ github.workspace }}/tt_submission/*.gds --tech gf180mcuD"
      - name: Test summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: tt/precheck/reports/results.xml
      - name: Add precheck report to summary
        if: always()
        working-directory: tt/precheck
        run: cat reports/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload precheck reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precheck_reports
          path: tt/precheck/reports
